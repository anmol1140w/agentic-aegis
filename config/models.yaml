# Model registry — maps logical model names to Ollama model identifiers.
# Edit model names to match your local Ollama installation (`ollama list`).

models:

  qwen-general:
    provider: ollama
    model: "qwen3.5:9b"
    capabilities:
      - general
      - reasoning
      - summarization
      - document_analysis
      - artifact_generation
    context_length: 32768
    priority: 10
    supports_thinking: true

  qwen-vision:
    provider: ollama
    model: "qwen3-vl:8b"
    capabilities:
      - vision
      - multimodal
      - image_analysis
      - document_analysis
    context_length: 32768
    priority: 10
    supports_thinking: true

  qwen-coder:
    provider: ollama
    model: "qwen3-coder:30b-a3b-q4_K_M"
    capabilities:
      - coding
      - debugging
      - code_execution
    context_length: 32768
    priority: 10
    supports_thinking: false

  llama-small:
    provider: ollama
    model: "Qwen2.5:1.5b"
    capabilities:
      - general
      - lightweight
    context_length: 8192
    priority: 1
    is_fallback: true
    supports_thinking: false
