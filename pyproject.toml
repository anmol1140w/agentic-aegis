[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["app", "app.api", "models", "routing", "runtime", "tools", "tools.ocr", "security", "storage", "pipeline"]

[project]
name = "sih-workbench"
version = "0.1.0"
description = "Sovereign Local AI Workbench — SIH 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "Pillow>=10.0",
    "aiosqlite>=0.20.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "paddleocr>=3.7.0",
    "paddlepaddle==3.2.0",
    "pdf2image>=1.17.0",
    "pypdf>=5.0.0",
    "python-docx>=1.0.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]
doc = [
    "pymupdf>=1.24.0",
    "docling>=2.0.0",
    "opencv-python-headless>=4.9.0",
]
artifacts = [
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.0.0",
]
sandbox = [
    "docker>=7.0.0",
]

[project.scripts]
sih-agent = "cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_ollama: requires the locally installed Ollama vision model",
]
